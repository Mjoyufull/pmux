[package]
name = "pmux"
version = "1.0.0-ktk"
edition = "2021"
rust-version = "1.70"

description = "Fast TUI package manager browser for multiple package managers"
license = "MIT"

[profile.release]
lto = "fat"
strip = true
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.release.package."*"]
opt-level = 3

[dependencies]
crossterm = "0.27"
ratatui = { version = "0.22.0", default-features = false, features = ["crossterm"] }
fuzzy-matcher = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.7"
eyre = "0.6"
lexopt = "0.3"
directories = "5.0"
bincode = "1.3"
sled = { version = "0.34", default-features = false }
scopeguard = "1.1"
dirs = "5.0"
flate2 = "1.0"
tar = "0.4"
walkdir = "2.3"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde_json = "1.0"
urlencoding = "2.1"
brotli = "7.0"
rayon = "1.10"
memmap2 = "0.9"
ahash = "0.8"
rmp-serde = "1.3"
rusqlite = { version = "0.31", features = ["bundled"] }
