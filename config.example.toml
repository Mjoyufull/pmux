# ============================================================================
# pmux Configuration File - Version 2.0.0-hugshine
# ============================================================================
# This file will be automatically created at: ~/.config/pmux/config.toml
# Copy this example and customize it to your liking!
#
# Color formats supported (case-insensitive):
#   - Named colors: "Red", "Green", "Blue", "Cyan", "Magenta", "Yellow", 
#                   "White", "Black", "Gray", "DarkGray"
#                   "LightRed", "LightGreen", "LightBlue", "LightYellow",
#                   "LightCyan", "LightMagenta"
#   - Hex colors: "#ff0000", "#00ff00", "#0000ff"
#
# Examples:
#   focused_border = "LightBlue"    # Named color
#   focused_border = "lightblue"    # Case-insensitive
#   focused_border = "#00ffff"      # Hex equivalent
# ============================================================================

[main]
# ============================================================================
# Main Settings
# ============================================================================

# Privilege escalation command
# Use "sudo" for most systems, "doas" for OpenBSD/Alpine, or custom wrapper
sudoers = "sudo"

# Border style
# true  = Rounded corners (╭─╮│╰─╯)./
# false = Plain corners (┌─┐│└─┘)
rounded_borders = false


[layout]
# ============================================================================
# Layout Configuration
# ============================================================================

# Width of the right column (installed packages list) as percentage
# Range: 10-50 (recommended: 25-35)
right_column_width_percent = 30

# Height of the input field in lines
# Range: 1-5 (recommended: 3)
input_field_height = 3

# Height of the description panel in lines
# Range: 3-20 (recommended: 5-10)
# This controls how much package information is visible
description_unit_height = 5

# The following are reserved for future features:
installed_list_percent = 50
terminal_percent = 50


[border_colours]
# ============================================================================
# Border Colors for Each Panel
# ============================================================================

# Results panel border (left side, top section)
results_unit = "#ffffff"

# Input panel border (left side, middle section)
# Note: Currently uses results_unit color

# Description panel border (left side, bottom section)
description_unit = "#ffffff"

# Installed packages panel border (right side)
installed_list_unit = "#ffffff"

# Terminal panel border (reserved for future use)
terminal_unit = "#ffffff"

# Focused panel border highlight
# This color is applied to the border of the currently focused panel
# (switches between results and installed with Tab or mouse)
# You can use color names like "LightBlue" or hex like "#00ffff"
focused_border = "LightCyan"

# Software Discovery mode border color
# Default border color for SD mode panels (can be overridden in [SD] section)
software_discovery = "#ffffff"


[text_colours]
# ============================================================================
# Text Colors for Each Panel
# ============================================================================

# Results panel - normal text color
results_unit_text = "#ffffff"

# Results panel - highlighted/selected item color
results_unit_highlight_text = "LightGreen"

# Description panel - normal text color
description_unit_text = "#ffffff"

# Description panel - package name highlight color
description_unit_highlight_text = "LightGreen"

# Installed panel - normal text color
installed_list_unit_text = "#ffffff"

# Installed panel - highlight color (reserved for future use)
installed_list_unit_highlight_text = "#00ff00"

# Terminal panel - normal text (reserved for future use)
terminal_unit_text = "#ffffff"

# Terminal panel - highlight text (reserved for future use)
terminal_unit_highlight_text = "#00ff00"

# Panel titles color (Results, Input, Description, Installed)
unit_title_text = "#ffffff"

# Software Discovery mode text colors
# Results panel text
sd_results_text = "#ffffff"
sd_results_highlight_text = "LightGreen"

# Details panel text
sd_details_text = "#ffffff"
sd_details_highlight_text = "LightGreen"

# Package Manager selector text
sd_pm_text = "#ffffff"
sd_pm_highlight_text = "LightGreen"

# SD mode titles
sd_title_text = "#ffffff"


[pm]
# ============================================================================
# Package Manager Configuration
# ============================================================================

# Host/primary package manager
# This PM will be prioritized in search results and shown first
# Options: "pacman", "dnf", "nix", "emerge", "pkgit"
hostpm = "pacman"

# Enabled package managers (in order of priority)
# 
# DEFAULT BEHAVIOR (enabled_pm = []):
#   All available package managers are loaded. This is the recommended setting
#   for most users. Host PM is prioritized in search results.
#
# SPECIFIC PMs (enabled_pm = ["list"]):
#   Explicitly list package managers you want. Host PM is always included.
#
# Available options:
#   "pacman" - Arch Linux official repositories
#   "paru"   - AUR (Arch User Repository) via paru/yay
#   "dnf"    - Fedora/RHEL/CentOS
#   "nix"    - Nix package manager
#   "emerge" - Gentoo Portage
#   "pkgit"  - Git-based package manager
#
# Example: Enable ALL available PMs (default):
enabled_pm = []
#
# Example: Enable specific PMs only:
# enabled_pm = ["pacman", "paru", "nix", "pkgit"]


[SD]
# ============================================================================
# Software Discovery Mode Configuration
# ============================================================================

# Border colors (inherit from [border_colours] if not set)
# results_border = "#ffffff"        # Results list border
# details_border = "#ffffff"        # Details panel border (not used, no borders)
# pm_selector_border = "#ffffff"    # Package manager selector border
# focused_border = "LightCyan"       # Inherits from [border_colours].focused_border

# Text colors (inherit from [text_colours] if not set)
# text_color = "#ffffff"            # Inherits from [text_colours].sd_details_text
# highlight_color = "LightGreen"    # Inherits from [text_colours].sd_details_highlight_text
# title_color = "#ffffff"           # Inherits from [text_colours].sd_title_text
# pm_highlight_text = "LightGreen"  # Inherits from [text_colours].sd_pm_highlight_text

# Background
# transparent_background = false    # true = transparent, false = use background_color
# background_color = "#282c34"      # OneDark background color

# Installed status colors
# installed_color = "#00ff00"       # Green for installed packages
# not_installed_color = "#ff5555"   # Red for not installed packages

# Layout
# results_height = 5                # Height of results list in lines


# ============================================================================
# Usage Examples
# ============================================================================
#
# Command Line:
#   pmux                    - Open TUI browser
#   pmux firefox            - Quick search for firefox
#   pmux -Ss firefox        - Same (pacman-style)
#   pmux @aur               - Show only AUR packages
#   pmux @aur firefox       - Filter to AUR + search firefox
#   pmux -S firefox         - Install firefox directly (no TUI)
#   pmux -Syu               - Full system upgrade
#   pmux -Q                 - List installed packages
#   pmux -Qi firefox        - Show detailed package info
#
# In TUI:
#   Type to search          - Fuzzy search packages
#   @aur firefox            - Filter to AUR + search firefox
#   Ctrl+Space              - Select/deselect package
#   Enter                   - Install selected packages
#   Tab                     - Switch focus (results ↔ installed)
#   Mouse hover             - Highlight items
#   Mouse click             - Select package
#   Mouse scroll            - Scroll panels
#   Esc or q                - Exit
#
# Keybinds:
#   j/k or Up/Down          - Navigate
#   Alt+j/Alt+k             - Alternative navigation
#   Ctrl+U/Ctrl+D           - Half page scroll
#   Home/End                - Jump to start/end
#   Ctrl+L                  - Clear search
#   Backspace               - Delete character
#
# Package Information Display:
#   Package descriptions now appear FIRST in the info panel for better UX:
#   *  package-name
#         Description:   What the package does (shown first!)
#         Latest version available: 1.0.0
#         Latest version installed: [ Not Installed ]
#         Size of files: 1,234 KiB
#         Homepage:      https://example.com
#         License:       MIT
#
# ============================================================================
# Third-Party Repositories
# ============================================================================
# pmux automatically detects enabled third-party repos from your system:
#
# Pacman (/etc/pacman.conf):
#   - chaotic-aur, archlinuxcn, blackarch, etc.
#   - Any repo defined in pacman.conf will be synced
#
# DNF (/etc/yum.repos.d/*.repo):
#   - rpmfusion, terra, copr repos, etc.
#   - Only repos with "enabled=1" are synced
#
# Gentoo (/etc/portage/repos.conf/):
#   - Overlays like guru, gentoo-zh, etc.
#   - All configured overlays are detected
#
# Nix:
#   - Uses nixpkgs unstable channel by default
#   - Flakes support coming soon
#
# No manual configuration needed - pmux reads your system config!
# ============================================================================

# ============================================================================
# Cache
# ============================================================================
# Package lists are cached in ~/.cache/pmux/ for 1 hour
# First run will be slow (parsing databases)
# Subsequent runs will be instant (loading from cache)
#
# To clear cache: rm -rf ~/.cache/pmux/
# ============================================================================
